[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "schliff"
version = "8.8.0"
description = "Deterministic quality scorer for AI agent instruction files. Multi-format (SKILL.md, CLAUDE.md, .cursorrules, AGENTS.md), 8-dimension scoring with security, anti-gaming detection, zero dependencies."
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["claude-code", "skill-linter", "autoresearch", "scoring", "deterministic", "quality", "autonomous-improvement", "linting", "code-quality", "cli", "static-analysis"]
authors = [
    {name = "Franz Paul"}
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Environment :: Console",
]

[project.scripts]
schliff = "skills.schliff.scripts.cli:main"

[project.urls]
Homepage = "https://github.com/Zandereins/schliff"
Repository = "https://github.com/Zandereins/schliff"
Documentation = "https://github.com/Zandereins/schliff/blob/main/docs/SCORING.md"
Issues = "https://github.com/Zandereins/schliff/issues"
Changelog = "https://github.com/Zandereins/schliff/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["skills*"]
exclude = ["skills*.tests", "skills*.tests.*", "tests", "tests.*"]

[tool.setuptools.package-data]
"skills" = ["**/*.md", "**/*.json", "**/*.sh", "**/*.js", "**/*.yml"]

[tool.setuptools.exclude-package-data]
"*" = [
    "tests/**",
    "tests/**/*",
    "**/tests/**",
    "**/tests/**/*",
    "**/test_*.py",
    "**/test-*.sh",
    "scripts/test-integration.sh",
    "scripts/test-self.sh",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["scoring", "shared", "nlp"]

[project.optional-dependencies]
evolve = ["litellm>=1.40.0,<2.0.0"]
# Phase-1 LLM-judge smoke-test only (skills/schliff/scripts/judge/judge_v0.py).
# Core schliff stays zero-dependency; install with `uv pip install -e ".[judge]"`.
judge = ["anthropic>=0.104,<1.0", "pydantic>=2.13,<3.0"]
# Phase 3b: mcp = ["mcp>=1.0.0,<2.0.0"]

[tool.pytest.ini_options]
testpaths = ["skills/schliff/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "security: marks security-specific tests",
]
