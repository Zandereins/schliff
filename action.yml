name: 'AGENTS.md Lint (Schliff)'
description: 'Deterministic CI quality gate for AGENTS.md — works with any agent tool (Cursor, Codex, Copilot, Claude Code).'
branding:
  icon: 'award'
  color: 'purple'
inputs:
  skill-path:
    description: 'Path to the instruction file to score, relative to repo root. Defaults to AGENTS.md at the repo root. Also supports SKILL.md, CLAUDE.md, .cursorrules.'
    required: false
    default: ''
  eval-suite:
    description: 'Path to eval-suite.json (auto-discovered if not set)'
    required: false
  minimum-score:
    description: 'Minimum composite score to pass (0-100). PR fails if below.'
    required: false
    default: '0'
  comment-on-pr:
    description: 'Post score as PR comment'
    required: false
    default: 'true'
  schliff-version:
    description: 'Schliff version to install (e.g. "6.3.0", ">=7.0"). Defaults to latest.'
    required: false
    default: ''
  fail-on-dangling:
    description: 'Fail the build when the instruction file references setup/build/test commands that do not resolve in the repo. AGENTS.md / CLAUDE.md only; requires schliff >= 8.6.1.'
    required: false
    default: 'false'
outputs:
  composite:
    description: 'Composite score (0-100)'
    value: ${{ steps.score.outputs.composite }}
  grade:
    description: 'Grade letter (S/A/B/C/D/E/F)'
    value: ${{ steps.score.outputs.grade }}
  result_b64:
    description: 'Full JSON score result (base64 encoded)'
    value: ${{ steps.score.outputs.result_b64 }}
  dangling_count:
    description: "Number of dangling commands found. Empty string when the check did not run (non-AGENTS/CLAUDE format, engine older than 8.6.1, or no valid output)."
    value: ${{ steps.dangling.outputs.dangling_count }}
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install Schliff scorer
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.schliff-version }}
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          # Support both exact versions ("6.3.0") and specifiers (">=7.0")
          case "$INPUT_VERSION" in
            \>*|\<*|~*|!*) pip install "schliff$INPUT_VERSION" ;;
            *)              pip install "schliff==$INPUT_VERSION" ;;
          esac
        else
          pip install schliff
        fi

    - name: Run scorer
      id: score
      shell: bash
      env:
        INPUT_SKILL_PATH: ${{ inputs.skill-path }}
        INPUT_EVAL_SUITE: ${{ inputs.eval-suite }}
      run: |
        # Default to AGENTS.md at the repo root when no path is given (the
        # AGENTS.md-first entry point). Fail clearly if the file is missing,
        # with a message tailored to whether the path was explicit or defaulted.
        EXPLICIT_PATH="${INPUT_SKILL_PATH}"
        INPUT_SKILL_PATH="${INPUT_SKILL_PATH:-AGENTS.md}"
        SKILL_FULL="${GITHUB_WORKSPACE}/${INPUT_SKILL_PATH}"
        if [ ! -f "$SKILL_FULL" ]; then
          if [ -n "$EXPLICIT_PATH" ]; then
            echo "::error::Instruction file not found: ${INPUT_SKILL_PATH} (from the 'skill-path' input)."
          else
            echo "::error::No AGENTS.md found at the repo root. Add one, or set the 'skill-path' input to your instruction file."
          fi
          exit 1
        fi
        EVAL_FLAG=""
        if [ -n "${INPUT_EVAL_SUITE}" ]; then
          EVAL_FLAG="--eval-suite"
          EVAL_PATH="${GITHUB_WORKSPACE}/${INPUT_EVAL_SUITE}"
        fi
        if [ -n "$EVAL_FLAG" ]; then
          RESULT=$(schliff score "$SKILL_FULL" "$EVAL_FLAG" "$EVAL_PATH" --json 2>/tmp/schliff_stderr) || true
        else
          RESULT=$(schliff score "$SKILL_FULL" --json 2>/tmp/schliff_stderr) || true
        fi

        # NOTE: every python3 -c below uses -P (PYTHONSAFEPATH) because this action
        # runs in the consumer's checked-out workspace (GITHUB_WORKSPACE). Without it,
        # CWD is on sys.path[0] and an attacker's PR could plant a json.py / shadow the
        # skills.* package at the repo root to get code execution in the consumer's CI.
        if [ -z "$RESULT" ] || ! echo "$RESULT" | python3 -P -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
          echo "::error::Schliff scorer produced invalid output. stderr: $(cat /tmp/schliff_stderr 2>/dev/null)"
          exit 1
        fi

        COMPOSITE=$(echo "$RESULT" | python3 -P -c "import sys,json; print(json.load(sys.stdin)['composite_score'])" 2>/dev/null) || true
        if [ -z "$COMPOSITE" ]; then
          echo "::error::Schliff output is missing composite_score. stderr: $(cat /tmp/schliff_stderr 2>/dev/null)"
          exit 1
        fi
        echo "composite=$COMPOSITE" >> "$GITHUB_OUTPUT"

        # Delegate grade mapping to Schliff's terminal_art.score_to_grade so
        # thresholds (incl. the E band 35-49) stay aligned with `schliff verify`.
        GRADE=$(SCORE_VAL="$COMPOSITE" python3 -P -c "
        import os
        from skills.schliff.scripts.terminal_art import score_to_grade
        print(score_to_grade(float(os.environ['SCORE_VAL'])))
        ")
        echo "grade=$GRADE" >> "$GITHUB_OUTPUT"

        # Write result to temp file to avoid heredoc injection
        echo "$RESULT" > /tmp/schliff_result.json
        # -w0 disables line wrapping (Ubuntu default wraps at 76 chars)
        RESULT_B64=$(base64 -w0 < /tmp/schliff_result.json)
        echo "result_b64=$RESULT_B64" >> "$GITHUB_OUTPUT"
        echo "Score: $COMPOSITE/100 [$GRADE]"

        # Detected format, for the AGENTS.md/CLAUDE.md-only dangling gate.
        # `.get` (not `[...]`) so a pre-8.x engine that omits the key does not
        # KeyError (schliff 6.3.0 emits no `format`).
        FORMAT=$(echo "$RESULT" | python3 -P -c "import sys,json; print(json.load(sys.stdin).get('format',''))" 2>/dev/null) || true
        echo "format=$FORMAT" >> "$GITHUB_OUTPUT"
        # The already-resolved absolute path — single source of truth so the
        # dangling step does not re-derive the default-to-AGENTS.md logic.
        echo "skill_full=$SKILL_FULL" >> "$GITHUB_OUTPUT"

    - name: Check dangling commands
      id: dangling
      # AGENTS.md / CLAUDE.md only. `check-commands` resolves each setup/build/test
      # command against the repo; other formats are skill-/editor-local and would
      # invite false positives. Never fails: exit 1 is the engine's "dangling found"
      # signal, and any error degrades to count 0 (the comment/gate handle the rest).
      if: steps.score.outputs.format == 'agents.md' || steps.score.outputs.format == 'claude.md'
      shell: bash
      env:
        SKILL_FULL: ${{ steps.score.outputs.skill_full }}
      run: |
        # Resolve against the file's OWN directory (engine default, no --repo): for a
        # repo-root AGENTS.md this equals GITHUB_WORKSPACE; for a nested file it uses
        # the nested manifest (safer than the root one). Executes nothing — static only.
        schliff check-commands "$SKILL_FULL" --json > /tmp/schliff_dangling.json 2>/dev/null || true
        # -P (PYTHONSAFEPATH): the workspace is attacker-writable via PR; a planted
        # json.py / shadowed skills.* at the repo root must not land on sys.path.
        # Validate shape; an old engine (no subcommand) writes nothing here -> count 0.
        COUNT=$(python3 -P -c "
        import sys, json
        try:
            d = json.load(open('/tmp/schliff_dangling.json'))
            assert isinstance(d, dict) and isinstance(d.get('dangling_count'), int) and isinstance(d.get('results'), list)
            print(d['dangling_count'])
        except Exception:
            print(0)
        " 2>/dev/null) || COUNT=0
        [ -z "$COUNT" ] && COUNT=0
        echo "dangling_count=$COUNT" >> "$GITHUB_OUTPUT"
        if [ "$COUNT" -gt 0 ] 2>/dev/null; then
          # -w0: Ubuntu base64 wraps at 76 cols; the github-script decode needs one line.
          echo "dangling_b64=$(base64 -w0 < /tmp/schliff_dangling.json)" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT dangling command(s):"
          # Plain-text summary — the only human-visible surface on push events.
          python3 -P -c "
          import json
          for r in json.load(open('/tmp/schliff_dangling.json'))['results']:
              if r.get('status') == 'dangling':
                  print(f\"  line {r.get('line','?')}: {r.get('command','')}  ->  {r.get('evidence','')}\")
          " 2>/dev/null || true
        else
          echo "No dangling commands."
        fi

    - name: Check minimum score
      if: inputs.minimum-score != '0'
      shell: bash
      env:
        COMPOSITE: ${{ steps.score.outputs.composite }}
        MINIMUM: ${{ inputs.minimum-score }}
      run: |
        python3 -P -c "
        import sys, os
        score = float(os.environ['COMPOSITE'])
        minimum = float(os.environ['MINIMUM'])
        if score < minimum:
            print(f'::error::Score {score} is below minimum {minimum}')
            sys.exit(1)
        print(f'Score {score} passes minimum {minimum}')
        "

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        # Values reach the script through the environment, never spliced into
        # its source. `minimum-score` is the one that matters: it is workflow-
        # author input, so a quote in it would have closed the string literal
        # and everything after it would have been evaluated as code. RESULT_B64
        # and GRADE are engine output with safe charsets, moved along with it so
        # the step has no interpolation left to audit. Same reasoning as the
        # `env: MINIMUM` + `os.environ` pattern in "Check minimum score" above.
        RESULT_B64: ${{ steps.score.outputs.result_b64 }}
        GRADE: ${{ steps.score.outputs.grade }}
        MINIMUM_SCORE: ${{ inputs.minimum-score }}
        DANGLING_B64: ${{ steps.dangling.outputs.dangling_b64 }}
      with:
        script: |
          const b64 = process.env.RESULT_B64 || '';
          const result = JSON.parse(Buffer.from(b64, 'base64').toString('utf8'));
          const score = result.composite_score;
          const dims = result.dimensions;
          const grade = process.env.GRADE || '';
          const minimum = parseFloat(process.env.MINIMUM_SCORE) || 0;
          const passed = minimum === 0 || score >= minimum;
          const icon = score >= 95 ? '🟢' : score >= 75 ? '🟡' : '🔴';

          // Unicode progress bar
          function bar(val) {
            if (val == null || val < 0) return '—';
            const filled = Math.round(val / 5);
            return '█'.repeat(filled) + '░'.repeat(20 - filled) + ` ${Math.round(val)}`;
          }

          // operational_coverage is emitted for AGENTS.md only; other formats
          // never carry the key and are skipped by the null-check below.
          const dimOrder = ['structure', 'operational_coverage', 'triggers', 'quality', 'edges', 'efficiency', 'composability', 'clarity'];

          // Map the engine's exact format keys (scoring/formats.py) to display labels.
          // Note: the cursor format is emitted as 'cursorrules' (no leading dot).
          const FMT = {
            'agents.md': 'AGENTS.md',
            'skill.md': 'SKILL.md',
            'claude.md': 'CLAUDE.md',
            'cursorrules': '.cursorrules',
          };
          const fmtLabel = result.format
            ? (FMT[String(result.format).toLowerCase()] || String(result.format))
            : 'instruction file';
          let body = `<!-- schliff-score-comment -->\n`;
          body += `## ${icon} Schliff — ${fmtLabel} quality: ${score}/100 [${grade}]\n\n`;

          if (minimum > 0) {
            body += passed
              ? `✅ Passes minimum score of ${minimum}\n\n`
              : `❌ Below minimum score of ${minimum}\n\n`;
          }

          body += `| Dimension | Score | | \n`;
          body += `|:----------|------:|:----|\n`;
          for (const dim of dimOrder) {
            const s = dims[dim];
            // Omit dims not folded into this format's headline — the engine emits
            // JSON null for eval-gated/excluded dims (e.g. triggers/quality/edges
            // on AGENTS.md). Rendering them would show a misleading 0/100. This
            // matches the engine's own terminal output, which omits them. The
            // eval-suite nudge for SKILL.md still rides in the warnings section.
            if (s == null || s < 0) continue;
            const dimIcon = s >= 75 ? '🟢' : s >= 50 ? '🟡' : '🔴';
            body += `| ${dim} | ${Math.round(s)}/100 | ${dimIcon} \`${bar(s)}\` |\n`;
          }

          if (result.warnings?.length) {
            body += `\n<details><summary><b>⚠️ Warnings (${result.warnings.length})</b></summary>\n\n`;
            result.warnings.forEach(w => body += `- ${w}\n`);
            body += `\n</details>\n`;
          }

          // --- Dangling commands section (AGENTS.md / CLAUDE.md only) ------------
          // db64 is EMPTY in the common case (no danglings, step skipped, or old
          // engine); a bare JSON.parse(Buffer.from('',...)) throws SyntaxError and
          // would abort this whole step, killing the score comment too. Guard it.
          const db64 = process.env.DANGLING_B64 || '';
          let dangling = [];
          if (db64) {
            try {
              dangling = (JSON.parse(Buffer.from(db64, 'base64').toString('utf8')).results || [])
                .filter(r => r.status === 'dangling');
            } catch { dangling = []; }
          }
          // Attacker-authored command/evidence text: strip backticks (code-span
          // break-out), collapse control chars, and defang the pipe. Rendered inside
          // a code span so `[x](url)`/`!` cannot become a link or image.
          function cell(s) {
            return String(s ?? '')
              .replace(/`/g, '')
              .replace(/[\x00-\x1f]+/g, ' ')
              .replace(/\|/g, '│')
              .slice(0, 120);
          }
          if (dangling.length) {
            const seen = new Set();
            const rows = dangling.filter(r => {
              const k = `${r.line}:${r.command}`;
              if (seen.has(k)) return false;
              seen.add(k);
              return true;
            }).slice(0, 10);
            body += `\n### 🔗 Dangling commands (${dangling.length})\n\n`;
            body += `These commands in ${fmtLabel} don't resolve to a make target, npm script, or path in this repo:\n\n`;
            body += `| Line | Command | Why |\n|-----:|:--------|:----|\n`;
            for (const r of rows) {
              body += `| ${r.line ?? '—'} | \`${cell(r.command)}\` | \`${cell(r.evidence)}\` |\n`;
            }
            if (dangling.length > rows.length) {
              body += `\n…and ${dangling.length - rows.length} more.\n`;
            }
          }

          body += `\n---\n<sub>Scored by [Schliff](https://github.com/Zandereins/schliff) — the deterministic AGENTS.md quality gate</sub>`;

          // Update existing comment or create new one
          const marker = '<!-- schliff-score-comment -->';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(c => c.body?.includes(marker));

          // On a PR from a fork, GITHUB_TOKEN is read-only, so posting fails. That
          // is not a build error — the score/gate already ran and the job log carries
          // the summary. Degrade gracefully instead of turning the consumer's CI red.
          try {
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
          } catch (e) {
            core.warning(`Could not post the Schliff comment (likely a fork PR with a read-only token): ${e.message}`);
          }

    - name: Enforce dangling gate
      # Opt-in, and LAST: the comment above always posts first, then (only if the
      # consumer asked) the build goes red. `!= ''` matters — a skipped dangling
      # step yields '' (not '0'), which must not trip the gate.
      if: inputs.fail-on-dangling == 'true' && steps.dangling.outputs.dangling_count != '' && steps.dangling.outputs.dangling_count != '0'
      shell: bash
      env:
        COUNT: ${{ steps.dangling.outputs.dangling_count }}
        SKILL_PATH: ${{ inputs.skill-path }}
      run: |
        echo "::error::${COUNT} dangling command(s) in ${SKILL_PATH:-AGENTS.md} do not resolve in this repo. See the PR comment / job log above."
        exit 1
