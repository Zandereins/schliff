name: Playground pin drift

# The deployed playground installs schliff from a committed, hash-pinned uv.lock.
# Vercel deploys are manual (CLI), which uploads the local working tree — so a
# stale/dirty local lock can ship a different engine than the one in version
# control (this already happened once and silently shipped a ReDoS-vulnerable
# engine, caught only by luck). This asserts the LIVE deployed engine version
# equals the pin committed in playground/pyproject.toml. Source-of-truth-agnostic,
# covers both CLI and Git-integration deploys because it probes the live URL.

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned (matches other workflows)
      - name: Assert live engine == committed pin
        run: |
          set -euo pipefail
          INTENDED=$(grep -oE 'schliff==[0-9]+\.[0-9]+\.[0-9]+' playground/pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$INTENDED" ]; then
            echo "::error::could not parse the schliff pin from playground/pyproject.toml"; exit 1
          fi
          LIVE=$(curl -fsS --max-time 30 https://schliff-playground.vercel.app/api/score | jq -r '.engine_version // "missing"')
          echo "intended (pyproject pin): $INTENDED"
          echo "live (deployed engine):   $LIVE"
          if [ "$LIVE" != "$INTENDED" ]; then
            echo "::error::PLAYGROUND PIN DRIFT — live engine '$LIVE' != committed pin '$INTENDED'. A stale/dirty deploy shipped the wrong engine; redeploy the playground from a clean tree (git status must be clean)."
            exit 1
          fi
          echo "OK: live playground engine matches the committed pin ($INTENDED)."
