name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint gate for the project's own Python (dogfoods "the Ruff for SKILL.md").
  # ENFORCING: the baseline is clean (0 ruff findings across E/F/W/I), so any
  # new finding fails the build. Findings are emitted as GitHub annotations via
  # --output-format=github. ruff is pinned for reproducibility.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff==0.15.8"

      - name: Run ruff (enforcing — baseline is clean)
        run: ruff check --output-format=github skills/schliff/scripts/

      # Markdown gate. Conventions live in .markdownlint-cli2.jsonc, which
      # records which rules this repo deliberately ignores and which it treats
      # as correctness (a short table row silently drops data on GitHub; a
      # missing blank line merges a list into the paragraph above).
      #
      # No setup-node: GitHub-hosted runners ship Node, and pinning the linter
      # version is what buys reproducibility here — same reasoning as the
      # `ruff==0.15.8` pin above.
      #
      # File list comes from git rather than a glob, so CI lints exactly the
      # tracked files. A `**/*.md` glob would additionally catch build/ and
      # .hydra/ artifacts locally while missing them in a fresh checkout, i.e.
      # local and CI would disagree.
      - name: Run markdownlint (enforcing — baseline is clean)
        run: git ls-files '*.md' | xargs npx --yes markdownlint-cli2@0.23.2

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run integration tests
        working-directory: skills/schliff
        run: |
          set +e
          OUTPUT=$(bash scripts/test-integration.sh --no-runtime-auto 2>&1)
          rc=$?
          set -e
          echo "$OUTPUT"
          # A crashed script (non-zero exit before printing the Results line)
          # must never report green — fail on rc, on a missing Results line,
          # or on zero tests having run.
          if [ "$rc" -ne 0 ]; then
            echo "::error::test-integration.sh exited with code $rc"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qP 'Results:\s*[0-9]+\s*passed,\s*[0-9]+\s*failed'; then
            echo "::error::Results summary line not found — test script did not complete"
            exit 1
          fi
          PASSED=$(echo "$OUTPUT" | grep -oP 'Results:\s*\K[0-9]+(?=\s*passed)')
          FAILED=$(echo "$OUTPUT" | grep -oP 'Results:\s*[0-9]+\s*passed,\s*\K[0-9]+(?=\s*failed)')
          if [ "$((PASSED + FAILED))" -eq 0 ]; then
            echo "::error::No integration tests ran (0 passed, 0 failed)"
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then exit 1; fi

      - name: Run self-tests
        working-directory: skills/schliff
        run: bash scripts/test-self.sh

      - name: Install pytest
        run: pip install "pytest>=8,<9"

      - name: Run unit tests
        working-directory: skills/schliff
        run: python3 -m pytest tests/unit/ -v

      # Dogfood: schliff holds its own AGENTS.md to the dangling-command gate.
      # Fails CI if any setup/build/test command in AGENTS.md stops resolving
      # to a real make target / npm script / path in this repo.
      - name: Dogfood check-commands on own AGENTS.md
        working-directory: skills/schliff
        run: python3 -m scripts.cli check-commands ../../AGENTS.md --repo ../..

      - name: Run proof test
        working-directory: skills/schliff
        run: bash tests/proof/test-proof.sh

  test-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install "pytest>=8,<9"

      - name: Run unit tests
        working-directory: skills/schliff
        run: python3 -m pytest tests/unit/ -q

  test-report:
    runs-on: ubuntu-latest
    needs: [test, test-macos]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run integration tests
        id: integration
        working-directory: skills/schliff
        run: |
          set +e
          OUTPUT=$(bash scripts/test-integration.sh --no-runtime-auto 2>&1)
          rc=$?
          set -e
          echo "$OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::test-integration.sh exited with code $rc"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qP 'Results:\s*[0-9]+\s*passed,\s*[0-9]+\s*failed'; then
            echo "::error::Results summary line not found — test script did not complete"
            exit 1
          fi
          PASSED=$(echo "$OUTPUT" | grep -oP 'Results:\s*\K[0-9]+(?=\s*passed)')
          FAILED=$(echo "$OUTPUT" | grep -oP 'Results:\s*[0-9]+\s*passed,\s*\K[0-9]+(?=\s*failed)')
          TOTAL=$((PASSED + FAILED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No integration tests ran (0 passed, 0 failed)"
            exit 1
          fi
          echo "test_passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "test_total=$TOTAL" >> "$GITHUB_OUTPUT"
          if [ "$FAILED" -gt 0 ]; then exit 1; fi

      - name: Run scorer
        id: scorer
        working-directory: skills/schliff
        run: |
          RESULT=$(python3 scripts/score-skill.py SKILL.md --json 2>/dev/null)
          COMPOSITE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['composite_score'])")
          echo "Composite score: $COMPOSITE"
          echo "composite_score=$COMPOSITE" >> "$GITHUB_OUTPUT"
          python3 -c "import sys; assert float(sys.argv[1]) >= 90, f'Score {sys.argv[1]} below threshold'" "$COMPOSITE"

      - name: Run eval suite
        working-directory: skills/schliff
        run: bash scripts/run-eval.sh SKILL.md eval-suite.json --no-runtime-auto 2>/dev/null
