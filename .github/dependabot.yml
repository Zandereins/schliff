version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # One PR per update round: split bumps of lockstep actions
    # (codeql-action/init + /analyze) fail CI when versions mix.
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    # No CI job installs the `[judge]` extra and the only judge test runs with
    # mock=True, so a green check on an anthropic major bump proves nothing about
    # the judge. Widening that range is a decision to make by hand, after the
    # extra is actually exercised in CI — not a PR to merge on a green tick.
    ignore:
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]
